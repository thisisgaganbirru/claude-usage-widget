version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
      runtime-patch:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Electron majors are bumped on purpose, with the breaking-change
      # notes read and the packaged app smoke-tested (see ADR-001).
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
