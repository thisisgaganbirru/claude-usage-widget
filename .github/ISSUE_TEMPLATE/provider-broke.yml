name: A provider stopped working
description: A quota card shows an error, stale data, or wrong numbers.
labels: [bug, provider]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Claude (claude.ai login)
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and OS
      placeholder: "1.0.4 on Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you see
      description: The card state, the error text, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: >
        Relevant lines from main.log in the app's user data folder (the
        settings screen will show the path). Remove anything that looks
        like a token or cookie before pasting; the app should never log
        one, and if it did, that is a separate security report.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I am on the latest release
          required: true
        - label: Signing out and back in did not fix it
        - label: The vendor's own website shows the account is active
