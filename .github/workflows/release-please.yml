name: Release Please

# Manual only until P7 rewires releases. Switching the trigger to
# `push: branches: [main]` makes release-please open and maintain a
# release PR from conventional commits; merging it tags and publishes.
# Note: releases created with GITHUB_TOKEN do not trigger other
# workflows, so P7 either uses a fine-grained PAT or keys the build
# matrix off this workflow's `release_created` output.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
